<svg width="2372" height="1000" viewBox="0 0 2372 1000" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- YÂSÎN — TEK LEVHA: 3. and 4. AÇIKLAMA BÖL. together — ayahs 53 … 82,
     fifteen and fifteen, over the two big two-column sheets 53-68 and 69-82.
     ONE frame for two sections, because the atlas draws them as one band; the
     plan page keeps them apart as two green panels
     (/yasin-overview/panel-15.svg), and the green rim here is that page's
     ink — SHEET_COLORS.green.border. See acik-1.svg

     DRAWN AT THE ASPECT IT IS DISPLAYED AT, the rule every frame file in this
     project follows — an SVG plane here is stretched to (w, h) world units, so
     a shared square file would arrive with oval corners and a rim thicker
     across the top than down the sides.

       world 5.9035 x 2.4884  ->  2.372
       viewBox 2372 x 1000  ->  2.372
     one SVG unit = 2.488e-03 world units on both axes, so the 0.012
     rim and the 0.09 corner convert with the same factor either way.


     NO GROUND. This border used to wash its interior with off-white #FBFAF4 at 0.35. That fill is
     gone on purpose: the frame is a RIM ONLY, so the vellum surface underneath
     runs through it unbroken and the sections are told apart by the colour of
     their rim alone. Only the four large atlas borders lost their ground — the
     sheet frames inside them (SHEET_FRAME_SVGS) keep theirs.

     Change the rectangle in app/data/configs/yasin/index.ts and this file has
     to be redrawn to match. -->
<rect x="2.4" y="2.4" width="2367.2" height="995.2"
      rx="36.2" ry="36.2"
      fill="none"
      stroke="#6E9464" stroke-width="4.8"/>

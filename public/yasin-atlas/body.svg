<svg width="1219" height="1000" viewBox="0 0 1219 1000" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- YÂSÎN — TEK LEVHA: the body of the surah. Everything between the
     main verse (12) and its twin (83) sits inside this one frame; those two
     verses are deliberately outside it, which is the whole claim the page
     makes. Gold rim, because on every Yâsîn page the OUTERMOST frame is gold

     DRAWN AT THE ASPECT IT IS DISPLAYED AT, the rule every frame file in this
     project follows — an SVG plane here is stretched to (w, h) world units, so
     a shared square file would arrive with oval corners and a rim thicker
     across the top than down the sides.

       world 6.8815 x 5.6454  ->  1.219
       viewBox 1219 x 1000  ->  1.219
     one SVG unit = 5.645e-03 world units on both axes, so the 0.016
     rim and the 0.11 corner convert with the same factor either way.


     NO GROUND. This border used to wash its interior with cream #F5EEDC at 0.25. That fill is
     gone on purpose: the frame is a RIM ONLY, so the vellum surface underneath
     runs through it unbroken and the sections are told apart by the colour of
     their rim alone. Only the four large atlas borders lost their ground — the
     sheet frames inside them (SHEET_FRAME_SVGS) keep theirs.

     Change the rectangle in app/data/configs/yasin/index.ts and this file has
     to be redrawn to match. -->
<defs>
<linearGradient id="atlasBodyGold" x1="0" y1="500.0" x2="1219" y2="500.0" gradientUnits="userSpaceOnUse">
<stop stop-color="#968428"/>
<stop offset="0.503741" stop-color="#CDC577"/>
<stop offset="1" stop-color="#968428"/>
</linearGradient>
</defs>
<rect x="1.4" y="1.4" width="1216.2" height="997.2"
      rx="19.5" ry="19.5"
      fill="none"
      stroke="url(#atlasBodyGold)" stroke-width="2.8"/>
</svg>

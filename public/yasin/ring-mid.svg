<svg width="2600" height="1000" viewBox="0 0 2600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- YÂSÎN 1-12 — RING 2 of 3, the MIDDLE band. Encloses ayahs 7 … 10; the
     capsules against its top and bottom edges are ayah 7 and ayah 10, the
     middle pair of the chiasm. Painted over ring-outer.svg and painted over in
     turn by ring-inner.svg — see ring-outer.svg for how the three stack, why
     the visible band is the leftover margin between two rectangles, why the
     colours and the corner radius are Tevbe 24's, and why each file has to be
     drawn at its own display aspect.

     Lavender #E1E3F3 — Tevbe 24's shield fill — at the same 0.6 as the ring
     outside it and the one inside it. All three rings share one opacity so the
     onion's layers separate by TINT alone, the way Tevbe's own frames do.

     ASPECT — drawn AT the aspect it is displayed at:

         viewBox 2600 x 1000                  ->  2.600
         config  scaleX 1.30 / scaleY 0.50     ->  2.600

     one SVG unit = 5.00e-4 world on BOTH axes.

     GEOMETRY (world units at 1.30 x 0.50)
       outer edge   flush with the plane   ->  1.30 w x 0.50 h
       rim          9 units                ->  0.0045  (== the other two rings)
       corner r     80 units               ->  0.040   (== the other two rings) -->
<defs>
<linearGradient id="yasinRingMidGold" x1="0" y1="500" x2="2600" y2="500" gradientUnits="userSpaceOnUse">
<stop stop-color="#968428"/>
<stop offset="0.503741" stop-color="#CDC577"/>
<stop offset="1" stop-color="#968428"/>
</linearGradient>
</defs>
<rect x="4.5" y="4.5" width="2591" height="991"
      rx="80" ry="80"
      fill="#E1E3F3" fill-opacity="0.6"
      stroke="url(#yasinRingMidGold)" stroke-width="9"/>
</svg>

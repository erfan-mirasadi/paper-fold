<svg width="1875" height="1000" viewBox="0 0 1875 1000" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- YÂSÎN 1-12 — RING 1 of 3, the OUTERMOST band. Encloses ayahs 6 … 11; the
     two capsules that sit against its top and bottom edges are ayah 6 and
     ayah 11, the outermost pair of the chiasm.

     COLOUR follows Tevbe 24, which this whole sheet is drawn after: the
     translucent cream #F5EEDC at 0.6 — byte-for-byte /tevbe/dome-section.svg's
     fill — under the shared gold rim gradient (#968428 → #CDC577 → #968428).
     All three rings are painted at the SAME 0.6 that Tevbe's own frames use;
     they differ only in tint (cream here, lavender in ring-mid, blue in
     ring-inner) so the onion reads as three layers at a glance.

     THE SET. Three files — ring-outer (ayahs 6 … 11), ring-mid (ayahs 7 … 10)
     and ring-inner (ayahs 8 · 9) — drawn as three FILLED rounded rectangles and
     stacked by renderOrder 3 / 4 / 5 in the config. Each one paints over the
     middle of the one below it, so the visible cream is the margin between
     this rectangle and the lavender one: the "band" is a leftover, not a shape
     of its own. Consequence worth knowing before editing: to widen the cream
     band you move ring-MID in, not this file out.

     They are separate files rather than three rects in one SVG because each
     ring is also a drag/elevation zone of its own (customSectionId sec_ring1 /
     2 / 3), and an overlay carries exactly one zone. Peeling the outer ring
     lifts all six ayahs; peeling the middle one lifts four; the inner, two.

     CORNER RADIUS IS TEVBE'S, NOT A STADIUM'S. /nisa/all-section-1.svg — the
     frame around the whole of Tevbe 24 — carries rx 800 / ry 337.57 on a
     22087 x 10845 viewBox displayed at 1.15 x 1.24, i.e. 0.0417 x 0.0386 world.
     All three rings here are drawn at a flat 0.040 world on BOTH axes, which is
     also the sheet's own `styling.verseRadius` (0.042): frame corners and
     capsule corners are then the same curve, and the rings read as boxes
     nested in boxes rather than as three stadiums.

     Because the file is drawn AT its display aspect, one radius in SVG units is
     a true circle on screen — a shared file stretched to another aspect is
     exactly how the old rings ended up with corners half again wider than they
     were tall.

     ASPECT — drawn AT the aspect it is displayed at:

         viewBox 1875 x 1000                  ->  1.875
         config  scaleX 1.50 / scaleY 0.80     ->  1.875

     one SVG unit = 8.00e-4 world on BOTH axes.

     GEOMETRY (world units at 1.50 x 0.80)
       outer edge   flush with the plane   ->  1.50 w x 0.80 h
       rim          5.6 units              ->  0.0045  (== the other two rings,
                                                        == Tevbe's own gold band)
       corner r     50 units               ->  0.040 -->
<defs>
<linearGradient id="yasinRingOuterGold" x1="0" y1="500" x2="1875" y2="500" gradientUnits="userSpaceOnUse">
<stop stop-color="#968428"/>
<stop offset="0.503741" stop-color="#CDC577"/>
<stop offset="1" stop-color="#968428"/>
</linearGradient>
</defs>
<rect x="2.8" y="2.8" width="1869.4" height="994.4"
      rx="50" ry="50"
      fill="#F5EEDC" fill-opacity="0.6"
      stroke="url(#yasinRingOuterGold)" stroke-width="5.6"/>
</svg>

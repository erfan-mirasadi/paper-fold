<svg width="2900" height="1000" viewBox="0 0 2900 1000" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- YÂSÎN 1-12 — THE MANDORLA (ayah 12), the page's closing section.

     SHAPE. Two nested lenses — a pointed oval, tips left and right — with a
     rounded rectangle floated inside them for the text. It is the only section
     on the page that is neither the cloud nor a ring, which is the point: ayah
     12 answers the whole chiasm above it rather than belonging to any layer of
     it.

     COLOUR, like every other frame here, is Tevbe 24's palette over the shared
     gold gradient rather than the reference photo's green-over-red watercolour:
     teal #CFE2E6 (Tevbe's verse 11) for the outer lens, the pale maroon
     #F6EDE8 with its #B0504D rule (Tevbe's verse 12, the ayah-marker capsule)
     for the inner one, and cream #F3EAD6 for the card. The maroon rule is the
     only non-gold outline on the page — it is doing what the photo's red band
     does, marking the closing ayah, in the house's own ink.

     Unlike ring-*.svg, all three shapes live in ONE file. The rings are three
     files because each is separately draggable; the mandorla lifts as a single
     zone (sec_leaf), so splitting it would buy nothing and would put the
     burden of keeping two lens tips concentric on the config's offsets instead
     of on the geometry here.

     LENS CONSTRUCTION. Each lens is two quadratics sharing their endpoints at
     the tips. A quadratic reaches only HALFWAY to its control, so a lens whose
     apex should sit `a` above the axis needs its control at `2a`:

         outer apex y 11  ->  control y  500 - 2*(500-11)  = -478
         inner apex y 76  ->  control y  500 - 2*(500-76)  = -348

     and mirrored for the lower halves (1478, 1348). Move an apex without
     doubling the offset and the lens quietly flattens.

     THE CARD MUST FIT THE INNER LENS, AND ITS TOP CORNERS ARE WHAT BIND. The
     card is widest at its corners' outer edge, the lens is narrowest at the
     card's top, so that is where they collide — not at the card's waist. At
     y 200 the inner lens spans x 823 … 2077; the card's top-left corner reaches
     x 770 + 120 = 890, i.e. 67 units (0.027 world) of maroon to spare. Widen
     the card, raise it, or shrink its corner radius and the corners break out
     through the lens before anything else does.

     ASPECT — drawn AT the aspect it is displayed at:

         viewBox 2900 x 1000                 ->  2.900
         config  scaleX 1.16 / scaleY 0.40    ->  2.900

     one SVG unit = 4.0e-4 world on BOTH axes.

     GEOMETRY (world units at 1.16 x 0.40)
       outer lens   2878 x 978 units   ->  1.151 w x 0.391 h
       inner lens   2320 x 848 units   ->  0.928 w x 0.339 h
       text card    1360 x 600 units   ->  0.544 w x 0.240 h
       lens stroke  21 units           ->  0.0084  (== the rings' 0.0085)
       card stroke  12 units           ->  0.0048  (finer: it is a card edge,
                                                    not a frame band) -->
<defs>
<linearGradient id="yasinLeafGold" x1="0" y1="500" x2="2900" y2="500" gradientUnits="userSpaceOnUse">
<stop stop-color="#968428"/>
<stop offset="0.503741" stop-color="#CDC577"/>
<stop offset="1" stop-color="#968428"/>
</linearGradient>

</defs>

<!-- Outer lens — teal -->
<path d="M 11,500 Q 1450,-478 2889,500 Q 1450,1478 11,500 Z"
      fill="#CFE2E6" fill-opacity="0.7"
      stroke="url(#yasinLeafGold)" stroke-width="21" stroke-linejoin="round"/>

<!-- Inner lens — pale maroon, the page's one red rule -->
<path d="M 290,500 Q 1450,-348 2610,500 Q 1450,1348 290,500 Z"
      fill="#F6EDE8" fill-opacity="0.95"
      stroke="#B0504D" stroke-width="21" stroke-linejoin="round"/>


</svg>

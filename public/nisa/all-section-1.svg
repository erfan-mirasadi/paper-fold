<svg width="2209" height="1085" viewBox="0 0 22087 10845" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<!-- OUTER SECTION FRAME.  Pair file: all-section.svg (inner bands) - same
     construction, different fill and a different ry (see below).

     This file is rasterised once and then stretched onto a 1x1 plane by each
     config's scaleX/scaleY, so the two axes get DIFFERENT scale factors. A
     circle drawn here does not arrive on screen as a circle: at Imran-14's
     1.1 x 1.28 the old rx=ry=800 came out 2.37x taller than it was wide, and
     a uniform 90-unit border came out 2.37x thicker top/bottom than
     left/right. That is the "corners aren't round" - it is the stretch, not
     the rounding.

     So the ellipse here is PRE-DISTORTED to cancel the stretch:

         ry = rx * (vbH / vbW) * (scaleX / scaleY)
            = 800 * (10845 / 22087) * (1.1 / 1.28) = 337.57
         vertical border = 90 * same factor          = 37.98

     which lands on screen as a true circle (0.03984 x 0.03984 world) inside a
     border that is 0.00448 world on all four sides. Tuned to Imran-14
     (1.1 x 1.28); Tevbe-24's 1.15 x 1.24 wants 364 and is within 8%.
     Retune ry and the inner rect's y/height together if that changes.

     Drawn as gold rect + panel rect on top: concentric by construction
     (outer rx 800 / inner rx 710), and the inner rect's antialiased edge
     composites straight onto the gold, so there is no mask seam. The outer
     edge is still 224.41..21862.6 x 1083.2..10776.7, so no config moves. -->
<defs>
<linearGradient id="allSection1Gold" x1="224.41" y1="5930.27" x2="21862.6" y2="5930.27" gradientUnits="userSpaceOnUse">
<stop stop-color="#968428"/>
<stop offset="0.503741" stop-color="#CDC577"/>
<stop offset="1" stop-color="#968428"/>
</linearGradient>
</defs>
<rect x="224.41" y="1083.2" width="21638.19" height="9693.5" rx="800" ry="337.57" fill="url(#allSection1Gold)"/>
<rect x="314.41" y="1121.18" width="21458.19" height="9617.55" rx="710" ry="299.59" fill="#F0E4E5"/>
</svg>
